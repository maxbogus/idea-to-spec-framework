# Реестр скилов: метаданные жизненного цикла.
#
# Проверяется scripts/check_skills_registry.py — цель `make check-skills`,
# вызов из scripts/check-sync.sh (значит, и из `make check`).
#
# Соглашения:
# - Скил — каталог `skills/<name>/SKILL.md` с YAML frontmatter (`name`,
#   `description` + `Triggers on`, `allowed-tools`). Тело <= 60 строк;
#   тяжёлые каталоги и примеры — в `references/`.
# - `kind`: `guard` — инвариант (тело <= 30 строк), `procedure` — пошаговая
#   процедура, `reference` — справочник. Процедура без проверки не
#   регистрируется: `check: manual` допустим только для guard.
# - `stage`: стадия из enum оркестратора (`prompts/orchestrator.md`):
#   business | design_sketch | system | architecture | validation | plan.
# - `gate`: ba_gate | sa_gate | spec_gate | none.
# - `check`: путь к тесту/скрипту/набору кейсов, который проверяет класс
#   ошибок скила; путь резолвится от корня репозитория.
# - `references` — пути внутри `skills/<name>/references/`; проверяются на
#   существование и на принадлежность каталогу скила.
# - `dependencies` — процедурные: скил опирается на результат другого скила.
# - `evals: []` — поведенческих A/B по скилу ещё нет. Пустой список означает
#   «не измерено»; `check` при этом уже машинный.
# - `owner` — роль, отвечающая за жизненный цикл скила.

schema: 2
skills:
  - name: collect-sources
    file: skills/collect-sources/SKILL.md
    version: 1.1.0
    kind: procedure
    stage: business
    gate: ba_gate
    check: eval/cases/roles.jsonl
    scope: "сбор внешних источников с цитированием; внешний источник не становится фактом"
    inputs: ["бриф", "уже подтверждённые факты", "сформулированный пробел"]
    outputs: ["источники с датой и статусом «требует проверки»", "пометки [не подтверждено]"]
    dependencies: []
    evals: []
    owner: workshop-maintainer
    risk_level: medium

  - name: mock-respondents
    file: skills/mock-respondents/SKILL.md
    version: 1.1.0
    kind: procedure
    stage: business
    gate: ba_gate
    check: eval/cases/roles.jsonl
    scope: "модельные персоны с маркировкой синтетики; модельный ответ не доказывает спрос"
    inputs: ["типы пользователей", "один открытый вопрос на роль"]
    outputs: ["personas.md с пометкой синтетики", "гипотезы для проверки на людях"]
    dependencies: []
    evals: []
    owner: workshop-maintainer
    risk_level: high

  - name: analyze-data
    file: skills/analyze-data/SKILL.md
    version: 1.1.0
    kind: procedure
    stage: business
    gate: ba_gate
    check: eval/cases/roles.jsonl
    scope: "воспроизводимые расчёты: формула, provenance, база сравнения"
    inputs: ["числа из брифа", "ряды наблюдений и периоды"]
    outputs: ["метрики с источником, строкой и формулой", "явные пропуски вместо средних"]
    dependencies: []
    evals: []
    owner: workshop-maintainer
    risk_level: high

  - name: detect-contradictions
    file: skills/detect-contradictions/SKILL.md
    version: 1.1.0
    kind: guard
    stage: system
    gate: sa_gate
    check: eval/cases/roles.jsonl
    scope: "поиск расхождений между требованиями по осям: направление и величина"
    inputs: ["BR-*", "FR-*", "NFR-*", "данные прогона"]
    outputs: ["противоречия с названной осью в validation-report.md"]
    dependencies: []
    evals: []
    owner: workshop-maintainer
    risk_level: medium

  - name: quantify-nfr
    file: skills/quantify-nfr/SKILL.md
    version: 1.0.0
    kind: procedure
    stage: system
    gate: sa_gate
    check: tests/test_run_checks.py
    scope: "NFR без меры и порога превращается в измеримое требование или в явный пробел"
    inputs: ["NFR-*", "категория", "ограничения контура"]
    outputs: ["NFR с мерой, порогом и методом проверки", "маркер [не измеримо] для пробела"]
    dependencies: [analyze-data]
    evals: []
    owner: workshop-maintainer
    risk_level: high

  - name: define-acceptance
    file: skills/define-acceptance/SKILL.md
    version: 1.0.0
    kind: procedure
    stage: system
    gate: sa_gate
    check: tests/test_run_checks.py
    scope: "BDD-критерии приёмки с позитивным и негативным сценарием; без vague-слов"
    inputs: ["UC-*", "FR-*", "негативные условия"]
    outputs: ["AC-* Given/When/Then: позитивный и негативный", "проверяемые критерии для QA"]
