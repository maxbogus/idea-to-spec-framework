    scope: "ADR с контекстом, статусом, минимум двумя альтернативами и последствиями"
    inputs: ["архитектурное решение", "ограничения", "альтернативы"]
    outputs: ["ADR-* в spec.md §10", "условие пересмотра решения"]
    dependencies: []
    evals: []
    owner: workshop-maintainer
    risk_level: high

  - name: diagram-generation
    file: skills/diagram-generation/SKILL.md
    version: 1.2.0
    kind: procedure
    stage: architecture
    gate: sa_gate
    check: tests/test_diagram_source_sections.py
    scope: "диаграммы как производные артефактов: base/extended и паки (behavior, domain, process, ux, data, ai, infra, architecture)"
    inputs: ["ID артефактов (UC-*, J-*, BR-*)", "spec.md §6/§9 и условные §11–§18", "use-cases.md"]
