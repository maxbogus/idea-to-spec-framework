[project]
name = "idea-to-spec-ai-eval"
version = "0.1.0"
description = "Eval harness (promptfoo + pytest) для промптов idea-to-spec-ai"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pyyaml>=6.0.4",
    "types-pyyaml>=6.0.12.20261122",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",
    # RUF001/002/003: проект на русском языке — кириллица в строках, docstring'ах
    # и комментариях является нормой, а не опечаткой в латинице.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["check_artifact_policy", "check_eval_report_fresh", "check_run", "check_slides_overflow", "idea_to_spec", "mock_provider", "promptfoo_transform", "summarize_eval"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true
mypy_path = "scripts"
files = ["scripts", "tests"]
exclude = ["^\\.venv/", "^node_modules/"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_subclassing_any = false
disallow_untyped_calls = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["scripts"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "slow: long-running evaluation against a local LLM",
    "mock: deterministic replay without any LLM call",
]
