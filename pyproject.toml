[project]
name = "idea-to-spec-framework"
version = "0.2.0"
description = "Фреймворк «идея → спецификация»: промпты, методы, шаблоны, eval"
license = { file = "LICENSE" }
# 3.11 — минимум для tomllib в тестах; 3.12 — единственная версия, на которой
# гоняется CI. Верхняя граница 3.14 не даёт «уехать» на непроверенный мажор.
requires-python = ">=3.11,<3.14"
dependencies = []

[project.scripts]
idea-to-spec-framework = "idea_to_spec_framework:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pyyaml>=6.0.4",
    "types-pyyaml>=6.0.12.20261122",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["idea_to_spec_framework.py"]

[tool.hatch.build.targets.wheel.force-include]
"prompts" = "_itsf/prompts"
"methods" = "_itsf/methods"
"skills" = "_itsf/skills"
"subagents" = "_itsf/subagents"
"templates" = "_itsf/templates"
"eval" = "_itsf/eval"
"output" = "_itsf/output"
"docs" = "_itsf/docs"
"scripts" = "_itsf/scripts"
"tests" = "_itsf/tests"
"AGENTS.md" = "_itsf/AGENTS.md"
"README.md" = "_itsf/README.md"
"Makefile" = "_itsf/Makefile"
"architecture.md" = "_itsf/architecture.md"
"handout-index.md" = "_itsf/handout-index.md"
"standards-mapping.md" = "_itsf/standards-mapping.md"
"pyproject.toml" = "_itsf/pyproject.toml"
"package.json" = "_itsf/package.json"
# Паритет с dev-экспортом: без lock-файлов установка у потребителя
# невоспроизводима, без .gitignore артефакты eval попадают в его git,
# без LICENSE пакет разворачивается без лицензии.
"uv.lock" = "_itsf/uv.lock"
"package-lock.json" = "_itsf/package-lock.json"
".gitignore" = "_itsf/.gitignore"
".gitattributes" = "_itsf/.gitattributes"
"LICENSE" = "_itsf/LICENSE"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",
    # RUF001/002/003: проект на русском языке — кириллица в строках, docstring'ах
    # и комментариях является нормой, а не опечаткой в латинице.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["check_artifact_policy", "check_dor", "check_eval_report_fresh", "check_run", "check_slides_overflow", "idea_to_spec", "idea_to_spec_framework", "list_runs", "make_eval_config", "mock_provider", "promptfoo_transform", "summarize_eval"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true
mypy_path = "scripts"
files = ["idea_to_spec_framework.py", "scripts", "tests"]
exclude = ["^\\.venv/", "^node_modules/"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_subclassing_any = false
disallow_untyped_calls = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["scripts", "."]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "slow: long-running evaluation against a local LLM",
    "mock: deterministic replay without any LLM call",
]
